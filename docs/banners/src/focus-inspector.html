<!doctype html>
<html><head><meta charset="utf-8"><title>focus-inspector</title>
<link rel="stylesheet" href="frames.css">
<style>
  /* The point inspector (Dark) at the moment of the call: Seal housing, a note, a fresh photo, 7.6 mm/s against an
     expected 0-2.8, Fail chosen, out of range, Complete point ready. The panel turns toward the viewer; the pump it
     belongs to (same capture) sits behind it, out of focus. Night Background #08100F with a PrimaryContainer #17352C
     glow; the Fail call's ErrorColor #FF7A70 lifts a faint warm light under the buttons. */
  .stage { background:
      radial-gradient(60% 70% at 66% 55%, rgba(23,53,44,.9) 0%, rgba(23,53,44,0) 70%),
      linear-gradient(180deg, #0B1513 0%, #08100F 100%); --grain: .05; }
  .scene { position: absolute; left: -40px; top: 40px; width: 820px; height: 602px; filter: blur(5px) brightness(.62) saturate(.9);
    transform: perspective(1600px) rotateY(10deg) scale(.98); transform-origin: 100% 50%;
    -webkit-mask-image: radial-gradient(70% 70% at 55% 50%, #000 40%, transparent 85%); }
  .scene img { width: 100%; height: 100%; }
  .survey { --gs: 22px; --gc: rgba(44,64,58,.28); --gc2: rgba(30,46,41,.22);
    --gm: linear-gradient(90deg, transparent 30%, rgba(0,0,0,.8) 100%); }
  .warm { position: absolute; left: 650px; top: 380px; width: 420px; height: 200px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,122,112,.16), rgba(255,122,112,0)); filter: blur(20px); }
  .panel { position: absolute; left: 676px; top: -211px; width: 376px; height: 808px; border-radius: 18px; overflow: hidden;
    transform: perspective(1700px) rotateY(-14deg) rotateX(2deg); transform-origin: 0% 75%;
    box-shadow: 0 0 0 1px rgba(232,243,238,.06), 0 30px 60px -10px rgba(0,0,0,.7), 0 0 80px -20px rgba(110,231,174,.22);
    -webkit-mask-image: linear-gradient(180deg, transparent 32.5%, rgba(0,0,0,.55) 34.5%, #000 37%, #000 100%); }
  .panel img { width: 100%; height: 100%; }
</style></head>
<body><div class="stage grain">
  <div class="scene"><img src="cap/dark-inspect-scene@2x.png"></div>
  <div class="survey"></div>
  <div class="warm"></div>
  <div class="panel"><img src="cap/dark-inspect-panel@3x.png"></div>
</div></body></html>
