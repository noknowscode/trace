<!doctype html>
<html><head><meta charset="utf-8"><title>showcase-phones</title>
<link rel="stylesheet" href="frames.css">
<style>
  /* Three phones after the round: Today with five changes waiting to sync (Dark), the Sync queue holding them
     (Light, centre, raised) and Findings with the new corrective action (Dark). One session, so the counts agree.
     Field-green backdrop: PrimaryContainer (Dark) #17352C deepening to the night Background #08100F, lit by
     PrimaryVariantDark #0C6B48, with the surveyor's grid in Primary #6EE7AE at low alpha. */
  .stage { background:
      radial-gradient(55% 70% at 50% 42%, rgba(12,107,72,.70) 0%, rgba(12,107,72,0) 72%),
      linear-gradient(165deg, #1A3D32 0%, #17352C 40%, #0D1F1A 85%, #08100F 100%); --grain: .06; }
  .survey { --gs: 22px; --gc: rgba(110,231,174,.10); --gc2: rgba(110,231,174,.05);
    --gm: radial-gradient(70% 80% at 50% 45%, #000 0%, rgba(0,0,0,.6) 60%, transparent 100%); }
  .floor { position: absolute; left: 20%; right: 20%; bottom: 12px; height: 46px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.45), rgba(0,0,0,0)); filter: blur(8px); }
  .d { --bezel: 9px; --r: 38px; }
  .pl { left: 202px; top: 86px; width: 236px; height: 494px; }
  .pc { left: 467px; top: 30px; width: 266px; height: 560px; }
  .pr { left: 762px; top: 86px; width: 236px; height: 494px; }
</style></head>
<body><div class="stage grain on-night">
  <div class="survey"></div>
  <div class="floor"></div>
  <div class="device d pl"><div class="screen"><img src="cap/dark-phone-today-after@2x.png"></div></div>
  <div class="device d pr"><div class="screen"><img src="cap/dark-phone-findings@2x.png"></div></div>
  <div class="device d pc"><div class="screen"><img src="cap/light-phone-sync@2x.png"></div></div>
</div></body></html>
