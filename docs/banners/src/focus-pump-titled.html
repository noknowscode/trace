<!doctype html>
<html><head><meta charset="utf-8"><title>focus-pump-titled</title>
<link rel="stylesheet" href="frames.css">
<style>
  /* Optional titled variant of focus-pump: the display name in the app's own type face (Roboto Medium, the
     Material type the app ships through Uno.Fonts.Roboto), OnSurface (Dark) #E8F3EE. The pump moves right and down to
     make room. Otherwise as focus-pump:
     P-204, the CPU-rendered 3D centrifugal pump (Dark, Inspect tab, default view) with its four inspection points:
     1 Motor body Pass, 3 Coupling Watch, 4 Drive-end bearing Pass, 2 Seal housing Fail. The scene's own ground
     (Surface #101A18) is the centre of the backdrop, so the crop's edges dissolve into the night Background #08100F;
     a surveyor's grid in OutlineVariant #1E2E29 and a PrimaryContainer #17352C glow sit behind it. */
  .stage { background:
      radial-gradient(60% 64% at 58% 58%, #101A18 0%, #101A18 38%, rgba(16,26,24,0) 82%),
      radial-gradient(80% 90% at 50% 50%, #0E1916 0%, #08100F 100%); --grain: .05; }
  .glow { position: absolute; left: 260px; right: 90px; top: 150px; bottom: 30px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(23,53,44,.85), rgba(23,53,44,0)); filter: blur(30px); }
  .survey { --gs: 24px; --gc: rgba(44,64,58,.34); --gc2: rgba(30,46,41,.30);
    --gm: radial-gradient(75% 80% at 50% 50%, rgba(0,0,0,.0) 30%, rgba(0,0,0,.9) 70%, #000 100%); }
  .plane { position: absolute; left: 190px; top: 84px; width: 960px; height: 509px; transform-origin: 50% 70%;
    transform: perspective(1800px) rotateX(9deg);
    -webkit-mask-image: radial-gradient(60% 66% at 52% 50%, #000 62%, rgba(0,0,0,.55) 80%, transparent 100%),
                        linear-gradient(180deg, transparent 0%, #000 16%, #000 78%, transparent 100%);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .plane img { width: 100%; height: 100%; }
  @font-face { font-family: 'Roboto'; font-weight: 500; src: url('fonts/Roboto-Medium.ttf'); }
  h1 { position: absolute; left: 76px; top: 52px; margin: 0; font: 500 64px/1 'Roboto', sans-serif; letter-spacing: .12em;
    color: #E8F3EE; }
</style></head>
<body><div class="stage grain">
  <div class="survey"></div>
  <div class="glow"></div>
  <div class="plane"><img src="cap/dark-pump-scene@3x.png"></div>
  <h1>TRACE</h1>
</div></body></html>
